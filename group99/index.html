<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR Greeting Card</title>

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <script>
    AFRAME.registerComponent('color-changer', {
      init: function() {
        var colorList = ['#EF2D5E', '#FFC65D', '#4CC3D9', '#7BC8A4', '#9B59B6'];
        var current = 0;
        var ball = this.el;

        ball.addEventListener('click', function() {
          current = current + 1;
          if (current >= colorList.length) {
            current = 0;
          }
          ball.setAttribute('color', colorList[current]);
        });
      }
    });

    AFRAME.registerComponent('marker-status', {
      init: function() {
        var statusBar = document.getElementById('status');
        var marker = this.el;

        marker.addEventListener('markerFound', function() {
          statusBar.textContent = 'Marker FOUND - tap the red ball!';
          statusBar.style.background = '#2E7D32';
        });

        marker.addEventListener('markerLost', function() {
          statusBar.textContent = 'Marker LOST - point the camera at the Hiro marker';
          statusBar.style.background = '#C62828';
        });
      }
    });

    AFRAME.registerComponent('grow-on-tap', {
      init: function() {
        var big = false;
        var box = this.el;

        box.addEventListener('click', function() {
          if (big) {
            box.setAttribute('scale', '1 1 1');
            big = false;
          } else {
            box.setAttribute('scale', '1.5 1.5 1.5');
            big = true;
          }
        });
      }
    });
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #status {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 999;
      padding: 10px;
      text-align: center;
      color: white;
      font-family: sans-serif;
      background: #C62828;
    }
  </style>
</head>

<body>
  <div id="status">Looking for marker...</div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">

    <a-assets timeout="20000">
      <a-asset-item id="greeting-model" src="models/greeting.glb"></a-asset-item>
    </a-assets>

    <a-marker preset="hiro" marker-status>

      <a-plane color="#2C3E50" rotation="-90 0 0" width="1.6" height="1.6"></a-plane>

      <a-entity
        gltf-model="#greeting-model"
        position="0 0.1 0"
        scale="0.4 0.4 0.4"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
      </a-entity>

      <a-sphere
        class="clickable"
        color-changer
        color="#EF2D5E"
        radius="0.2"
        position="0.6 0.5 0"
        animation="property: position; from: 0.6 0.4 0; to: 0.6 0.8 0; dir: alternate; loop: true; dur: 700; easing: easeInOutQuad">
      </a-sphere>

      <a-box
        class="clickable"
        grow-on-tap
        color="#4CC3D9"
        position="-0.6 0.25 0"
        width="0.4"
        height="0.5"
        depth="0.4">
      </a-box>

      <a-cylinder color="#FFC65D" position="0 0.25 -0.5" radius="0.15" height="0.5"></a-cylinder>

      <a-text value="Happy Holidays!" align="center" color="#FFFFFF" width="3" position="0 1.4 0"></a-text>

    </a-marker>

    <a-entity camera cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>

  </a-scene>
</body>
</html>
